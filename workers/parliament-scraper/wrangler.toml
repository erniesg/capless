name = "capless-parliament-scraper"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# R2 bucket for storing raw Hansard responses
[[r2_buckets]]
binding = "R2"
bucket_name = "capless-preview"

# KV namespace for tracking checked dates
[[kv_namespaces]]
binding = "DATES_KV"
id = "02616e8644a44f02ae8e1cb90c40cffe"
preview_id = "1c9009d2b27747d288228db65070b340"

# Queue for processing dates with rate limiting
[[queues.producers]]
queue = "parliament-dates-queue"
binding = "DATES_QUEUE"

[[queues.consumers]]
queue = "parliament-dates-queue"
max_batch_size = 10  # Process 10 dates per batch
max_batch_timeout = 60  # Wait up to 60 seconds for batch
max_retries = 3  # Retry failed dates 3 times
dead_letter_queue = "parliament-dates-dlq"

# Daily cron trigger for checking new Hansard reports
# Once daily at 6am SGT (22:00 UTC previous day)
# Hansard transcripts have days-to-weeks publication lag, so 1x/day is plenty.
# Cost: ~1 Worker invocation + 1-30 queue messages (calendar days since last scrape).
[triggers]
crons = ["0 22 * * *"]  # 6am SGT daily

[env.development]
name = "capless-parliament-scraper-dev"
